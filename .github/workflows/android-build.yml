name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build dependencies
        run: |
          python -m pip install requests==2.32.3
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            .native
            app/src/main/jniLibs
            app/src/main/jniLibs-aggressive
          key: cpu-native-v2-${{ runner.os }}-${{ hashFiles('tools/build_native.py', 'native/**') }}
      - name: Build baseline CPU runtimes
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          python -u tools/build_native.py --variant baseline --jobs 2
      - name: Build aggressive CPU runtimes
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          python -u tools/build_native.py --variant aggressive --jobs 2
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sensevoice-cpu-arm64-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sensevoice-cpu-arm64-debug
          path: apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "apk/app-baseline-debug.apk#SenseVoice Benchmark (baseline, all arm64 phones)" \
            "apk/app-aggressive-debug.apk#SenseVoice Benchmark (aggressive, Snapdragon 8 Elite Gen 5+)" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes